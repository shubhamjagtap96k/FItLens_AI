apiVersion: apps/v1
kind: Deployment
metadata:
  name: fitlens-ai-deployment
  namespace: fitlens-prod
  labels:
    app: fitlens-ai
    tier: frontend-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fitlens-ai
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: fitlens-ai
    spec:
      containers:
        - name: fitlens-ai
          image: fitlensacr.azurecr.io/fitlens-ai:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
          envFrom:
            - configMapRef:
                name: fitlens-config
            - secretRef:
                name: fitlens-secrets
          readinessProbe:
            httpGet:
              path: /api/food/search?q=ping
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/food/search?q=ping
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
