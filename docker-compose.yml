services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fitlens-ai-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://fitlens_user:fitlens_secure_pass_2026@postgres:5432/fitlens_ai?schema=public
      - REDIS_URL=redis://redis:6379
      - NEXTAUTH_SECRET=fitlens-ai-ultra-secure-jwt-secret-key-32chars
      - NEXTAUTH_URL=http://localhost:3000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: fitlens-postgres
    restart: always
    environment:
      POSTGRES_USER: fitlens_user
      POSTGRES_PASSWORD: fitlens_secure_pass_2026
      POSTGRES_DB: fitlens_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitlens_user -d fitlens_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fitlens-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
